name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Rodar os testes (Mac/Linux)
        if: runner.os != 'Windows'
        run: sh mvnw -B test
      - name: Rodar os testes (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B test
